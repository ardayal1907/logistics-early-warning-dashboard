name: Tests

# Run on every push to main and on every pull request targeting main.
# A failing pytest run makes the job exit non-zero, which turns the workflow red
# and shows a failing badge - that is the default behaviour, nothing extra needed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint + types + pytest (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # 3.12 matches runtime.txt (Streamlit Cloud) and the Python version that
      # trained models/production_risk_model.pkl. The model is a pickle, so the
      # interpreter and scikit-learn versions used here must line up with the ones
      # recorded in models/production_risk_model_metadata.json.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Printed so that a version-mismatch failure is diagnosable straight from the
      # log rather than requiring a local reproduction.
      - name: Show resolved versions
        run: |
          python --version
          pip list

      # Lint and type checks run BEFORE the suite: they take seconds, and a
      # failure there is a mechanical fix, so there is no value in waiting for
      # pytest to finish first. Configuration for all three gates lives in
      # pyproject.toml - the commands below deliberately take no flags, so that
      # a local run and a CI run cannot drift apart.
      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      # --cov with no argument uses [tool.coverage.run] source. The job fails if
      # total coverage drops below [tool.coverage.report] fail_under.
      - name: Run tests with coverage
        run: pytest tests/ -q --cov --cov-report=term-missing --cov-report=xml

      # Uploaded even when an earlier step failed, so a coverage regression can
      # be inspected without re-running the job locally.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
